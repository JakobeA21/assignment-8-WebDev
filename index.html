
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personality Quiz</title>
    <link rel="icon" type="image/x-icon" href="/img/ideas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
      .answer-btn.selected {
        background-color: #0d6efd !important;
        color: white !important;
      }
      body {
        background-color: #f8f9fa;
      }
    </style>
</head>
<body>
    <h1 class="text-center mt-4">What's Your Personality Type?</h1>
    <p class="text-center text-muted mb-4">Answer these questions to discover your unique personality!</p>
    
    <!-- Start quiz element -->
    <div class="container d-flex justify-content-center" id="question-1">
      <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">1. How do you prefer to spend your weekend?</h4>
        <div class="row g-2">
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-question="q1" data-answer="A">Organizing a group activity</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-question="q1" data-answer="B">Exploring art galleries or museums</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-question="q1" data-answer="C">Reading or researching topics</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-question="q1" data-answer="D">Catching up with friends</button>
          </div>
        </div>
      </div>
    </div>
    <!-- End quiz element -->
    

    <!-- Connect to your script file here -->
     <script src = "./js/script.js"></script>
</body>
</html>
